[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "limencore"
version = "0.1.0"
description = "Open-core thought-journaling library"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/limencore"]